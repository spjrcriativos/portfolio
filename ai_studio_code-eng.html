<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sergio Peixoto Jr — Senior Designer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-outer: #120303;
      --bg-dark: #1c0505;
      --bg-burgundy: #360707;
      --surface-light: #f1eeed;
      --surface-card-light: #ffffff;
      --text-burgundy: #3d0707;
      --text-taupe: #a39a99;
      --text-body-light: #5c4747;
      --text-white: #f7f4f3;
      --text-white-muted: rgba(247, 244, 243, 0.68);
      --accent-red: #e62415;
      --accent-fire: #ff511a;
      --glass-bg: rgba(255, 255, 255, 0.08);
      --glass-border: rgba(255, 255, 255, 0.18);
      --light-border: rgba(61, 7, 7, 0.14);
      --radius-frame: 24px;
      --radius-card: 18px;
      --radius-thumb: 10px;
      --font-sans: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-mono: 'Space Grotesk', monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at 50% 0%, #3a0808 0%, var(--bg-outer) 72%);
      color: var(--text-white);
      font-family: var(--font-sans);
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    .presentation-wrapper {
      width: 100vw;
      height: 100dvh;
      padding: clamp(8px, 1.4vh, 18px) clamp(10px, 1.6vw, 24px) clamp(10px, 1.6vh, 20px);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .top-ruler {
      height: 14px;
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      padding: 0 28px;
      opacity: 0.35;
      flex-shrink: 0;
    }
    .top-ruler span { width: 1px; height: 8px; background: rgba(255, 255, 255, 0.45); }
    .top-ruler span:nth-child(4n+1) { height: 13px; background: rgba(255, 255, 255, 0.75); }

    .stage-frame {
      flex: 1;
      min-height: 0;
      position: relative;
      border-radius: var(--radius-frame);
      overflow: hidden;
      background: var(--bg-dark);
      box-shadow: 0 28px 80px rgba(0, 0, 0, 0.72), 0 0 0 1px rgba(255, 255, 255, 0.08);
      display: flex;
      flex-direction: column;
    }

    /* Global Navigation */
    .global-nav {
      position: absolute;
      top: 0; left: 0; right: 0;
      z-index: 40;
      height: 60px;
      padding: 0 clamp(16px, 2.2vw, 32px);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      pointer-events: none;
      transition: color 0.3s ease;
    }
    .global-nav > * { pointer-events: auto; }

    .brand-mark {
      display: inline-flex; align-items: center; gap: 10px;
      background: none; border: none; cursor: pointer;
      color: inherit; font-family: var(--font-sans); text-align: left;
    }
    .brand-icon {
      width: 30px; height: 30px; border-radius: 8px;
      background: var(--accent-red); color: #fff;
      font-weight: 800; font-size: 13px; letter-spacing: -0.04em;
      display: grid; place-items: center;
      box-shadow: 0 4px 14px rgba(230, 36, 21, 0.45);
    }
    .brand-label { font-size: 11px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; opacity: 0.9; }

    .nav-pills {
      display: flex; align-items: center; gap: 4px;
      background: rgba(18, 3, 3, 0.55);
      backdrop-filter: blur(12px);
      padding: 4px; border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.14);
    }
    .nav-pill {
      border: none; background: transparent;
      color: rgba(255, 255, 255, 0.72);
      font-family: var(--font-sans); font-size: 10.5px; font-weight: 600;
      letter-spacing: 0.04em; text-transform: uppercase;
      padding: 6px 11px; border-radius: 999px; cursor: pointer;
      transition: all 0.22s ease; white-space: nowrap;
    }
    .nav-pill:hover { color: #fff; background: rgba(255, 255, 255, 0.1); }
    .nav-pill.active { background: var(--accent-red); color: #fff; }

    .nav-controls { display: flex; align-items: center; gap: 6px; }

    .slide-counter {
      font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.08em;
      padding: 5px 10px; border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      background: rgba(18, 3, 3, 0.45); backdrop-filter: blur(8px); color: #fff;
    }

    .icon-circle-btn {
      width: 32px; height: 32px; border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.22);
      background: rgba(18, 3, 3, 0.5); backdrop-filter: blur(8px);
      color: #fff; cursor: pointer; display: grid; place-items: center;
      font-size: 13px; transition: all 0.2s ease;
    }
    .icon-circle-btn:hover { background: var(--accent-red); border-color: var(--accent-red); transform: scale(1.06); }

    .edit-toggle-btn {
      height: 32px; padding: 0 12px; border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.24);
      background: rgba(18, 3, 3, 0.55); backdrop-filter: blur(8px);
      color: #fff; font-family: var(--font-sans); font-size: 11px; font-weight: 700;
      letter-spacing: 0.04em; text-transform: uppercase; cursor: pointer;
      display: inline-flex; align-items: center; gap: 6px;
      transition: all 0.2s ease;
    }
    .edit-toggle-btn:hover, .edit-toggle-btn.active {
      background: var(--accent-red); border-color: var(--accent-red); color: #fff;
    }
    .edit-toggle-btn.hidden-for-clients { display: none; }

    .stage-frame.is-light .global-nav { color: var(--text-burgundy); }
    .stage-frame.is-light .nav-pills { background: rgba(61, 7, 7, 0.07); border-color: rgba(61, 7, 7, 0.14); }
    .stage-frame.is-light .nav-pill { color: rgba(61, 7, 7, 0.68); }
    .stage-frame.is-light .nav-pill:hover { color: var(--text-burgundy); background: rgba(61, 7, 7, 0.08); }
    .stage-frame.is-light .nav-pill.active { background: var(--text-burgundy); color: #fff; }
    .stage-frame.is-light .slide-counter,
    .stage-frame.is-light .icon-circle-btn,
    .stage-frame.is-light .edit-toggle-btn:not(.active) {
      background: rgba(61, 7, 7, 0.07); border-color: rgba(61, 7, 7, 0.16); color: var(--text-burgundy);
    }
    .stage-frame.is-light .icon-circle-btn:hover,
    .stage-frame.is-light .edit-toggle-btn:hover { background: var(--accent-red); border-color: var(--accent-red); color: #fff; }

    /* Screens */
    .screens-container { position: relative; flex: 1; min-height: 0; width: 100%; height: 100%; }

    .screen {
      position: absolute; inset: 0;
      opacity: 0; visibility: hidden;
      transform: translateY(14px) scale(0.992);
      transition: opacity 0.38s cubic-bezier(0.22, 1, 0.36, 1),
                  transform 0.38s cubic-bezier(0.22, 1, 0.36, 1), visibility 0.38s;
      overflow: hidden; display: flex; flex-direction: column;
    }
    .screen.active { opacity: 1; visibility: visible; transform: translateY(0) scale(1); z-index: 2; }

    /* COVER / HERO */
    .screen-hero {
      background-color: #160303; color: var(--text-white);
      justify-content: space-between;
      padding: 76px clamp(24px, 4vw, 56px) clamp(24px, 3.6vh, 44px);
    }
    .hero-bg {
      position: absolute; inset: 0; z-index: 0;
      background:
        radial-gradient(ellipse at 54% 25%, rgba(255, 110, 30, 0.38) 0%, rgba(120, 14, 10, 0.22) 38%, rgba(18, 3, 3, 0.92) 78%),
        linear-gradient(125deg, #280505 0%, #120303 100%);
    }
    .hero-bg img {
      width: 100%; height: 100%; object-fit: cover; object-position: center 30%;
      opacity: 0.72; filter: contrast(1.08) saturate(1.1); mix-blend-mode: lighten;
    }
    .hero-scrim {
      position: absolute; inset: 0; z-index: 1;
      background:
        linear-gradient(90deg, rgba(16, 3, 3, 0.9) 0%, rgba(16, 3, 3, 0.56) 45%, rgba(16, 3, 3, 0.78) 100%),
        linear-gradient(180deg, rgba(16, 3, 3, 0.6) 0%, rgba(16, 3, 3, 0.15) 45%, rgba(16, 3, 3, 0.92) 100%);
    }
    .hero-content {
      position: relative; z-index: 2; flex: 1; min-height: 0;
      display: grid; grid-template-columns: minmax(280px, 1fr) minmax(360px, 1.15fr);
      gap: clamp(24px, 4vw, 64px); align-items: end;
    }
    .hero-identity { display: flex; flex-direction: column; justify-content: space-between; height: 100%; padding-top: clamp(12px, 3vh, 32px); }
    .hero-kicker { display: inline-flex; align-items: center; gap: 10px; font-size: 11px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: var(--text-white-muted); }
    .asterisk { color: var(--accent-red); font-size: 20px; line-height: 1; font-weight: 800; display: inline-block; }
    .hero-title-block { margin: auto 0; }
    .hero-name {
      font-size: clamp(44px, 6.2vw, 94px); font-weight: 700; line-height: 0.9;
      letter-spacing: -0.045em; text-transform: uppercase; color: #fff;
      text-shadow: 0 12px 40px rgba(0, 0, 0, 0.5);
    }
    .hero-role-row { margin-top: clamp(14px, 2.2vh, 24px); display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
    .role-pill {
      display: inline-flex; align-items: center; gap: 8px; padding: 8px 16px; border-radius: 999px;
      background: var(--glass-bg); border: 1px solid var(--glass-border); backdrop-filter: blur(12px);
      font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #fff;
    }
    .role-pill .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent-fire); box-shadow: 0 0 10px var(--accent-fire); }
    .hero-cards-row { display: flex; gap: 12px; flex-wrap: wrap; }
    .hero-mini-card {
      background: rgba(255, 255, 255, 0.94); color: var(--text-burgundy);
      border-radius: 14px; padding: 12px 16px; min-width: 150px;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.35);
    }
    .hero-mini-card.dark { background: rgba(255, 255, 255, 0.08); color: #fff; border: 1px solid rgba(255, 255, 255, 0.16); backdrop-filter: blur(14px); }
    .hero-mini-card .big-num { font-size: clamp(22px, 2.4vw, 30px); font-weight: 800; letter-spacing: -0.04em; line-height: 1; }
    .hero-mini-card .mini-label { margin-top: 4px; font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; opacity: 0.75; }

    .hero-menu { display: flex; flex-direction: column; justify-content: flex-end; gap: clamp(4px, 0.9vh, 10px); padding-left: clamp(0px, 2vw, 24px); }
    .menu-caption { font-size: 10px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: rgba(255, 255, 255, 0.5); margin-bottom: 6px; }
    .typo-menu-btn {
      display: flex; align-items: center; justify-content: space-between; gap: 16px; width: 100%;
      background: transparent; border: none; border-bottom: 1px solid rgba(255, 255, 255, 0.14);
      padding: clamp(8px, 1.3vh, 14px) 6px; color: rgba(255, 255, 255, 0.88);
      cursor: pointer; text-align: left; transition: all 0.28s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .typo-menu-btn:first-of-type { border-top: 1px solid rgba(255, 255, 255, 0.14); }
    .typo-menu-left { display: flex; align-items: baseline; gap: 14px; min-width: 0; }
    .typo-menu-num { font-family: var(--font-mono); font-size: 12px; color: var(--accent-fire); font-weight: 700; flex-shrink: 0; }
    .typo-menu-label { font-size: clamp(22px, 2.75vw, 42px); font-weight: 600; line-height: 0.98; letter-spacing: -0.035em; text-transform: uppercase; }
    .typo-menu-arrow {
      width: 34px; height: 34px; border-radius: 50%; border: 1px solid rgba(255, 255, 255, 0.24);
      display: grid; place-items: center; font-size: 14px; flex-shrink: 0; transition: all 0.28s ease;
    }
    .typo-menu-btn:hover { border-bottom-color: var(--accent-fire); padding-left: 14px; color: #fff; }
    .typo-menu-btn:hover .typo-menu-arrow { background: var(--accent-red); border-color: var(--accent-red); transform: rotate(45deg); }

    /* LIGHT SCREENS */
    .screen-light {
      background: var(--surface-light); color: var(--text-burgundy);
      padding: 68px clamp(20px, 3vw, 40px) clamp(16px, 2.2vh, 28px);
    }

    /* BIO */
    .bio-grid { flex: 1; min-height: 0; display: grid; grid-template-columns: 1.25fr 0.9fr; gap: clamp(18px, 3vw, 40px); align-items: stretch; }
    .bio-main { display: flex; flex-direction: column; justify-content: space-between; min-height: 0; }
    .editorial-headline { font-size: clamp(28px, 3.5vw, 52px); font-weight: 600; line-height: 0.95; letter-spacing: -0.04em; text-transform: uppercase; color: var(--text-burgundy); }
    .editorial-headline .taupe { color: var(--text-taupe); font-weight: 500; }
    .inline-pill-badge {
      display: inline-flex; align-items: center; justify-content: center; vertical-align: middle;
      padding: 4px 14px; border-radius: 999px;
      background: linear-gradient(135deg, #2b0606 0%, #e62415 100%);
      color: #fff; font-size: 0.36em; letter-spacing: 0.08em; font-weight: 700;
      margin: 0 6px; transform: translateY(-4px);
    }
    .bio-copy { font-size: clamp(13px, 1.3vw, 17px); line-height: 1.55; color: var(--text-body-light); max-width: 62ch; }
    .bio-pillars { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
    .bio-pillar-card { background: #fff; border: 1px solid var(--light-border); border-radius: 16px; padding: clamp(12px, 1.6vh, 18px); display: flex; flex-direction: column; justify-content: space-between; gap: 8px; }
    .bio-pillar-card .num { font-family: var(--font-mono); font-size: 11px; font-weight: 700; color: var(--accent-red); }
    .bio-pillar-card h3 { font-size: 14px; font-weight: 700; letter-spacing: -0.02em; color: var(--text-burgundy); }
    .bio-pillar-card p { font-size: 11.5px; line-height: 1.4; color: var(--text-body-light); }

    .bio-visual-panel {
      background: linear-gradient(160deg, #3a0808 0%, #160303 65%, #8f180b 100%);
      border-radius: 20px; padding: clamp(18px, 2.4vh, 26px); color: #fff;
      display: flex; flex-direction: column; justify-content: space-between;
      position: relative; overflow: hidden; box-shadow: 0 22px 45px rgba(61, 7, 7, 0.24);
    }
    .bio-visual-panel.drag-over { outline: 3px dashed var(--accent-fire); outline-offset: -4px; }
    .bio-photo-bg {
      position: absolute; inset: 0; width: 100%; height: 100%;
      object-fit: cover; object-position: center 20%;
      z-index: 0;
    }
    .bio-photo-scrim {
      position: absolute; inset: 0; z-index: 1; pointer-events: none;
      background: linear-gradient(180deg,
        rgba(20, 3, 3, 0.36) 0%,
        rgba(20, 3, 3, 0.06) 36%,
        rgba(16, 3, 3, 0.84) 73%,
        rgba(12, 2, 2, 0.96) 100%);
    }
    .bio-panel-top, .bio-panel-bottom {
      position: relative; z-index: 2;
    }
    .bio-panel-top {
      display: flex; justify-content: space-between; align-items: center; gap: 8px;
    }
    .bio-panel-bottom {
      display: flex; flex-direction: column; gap: 14px; margin-top: auto;
    }
    .bio-quote { font-size: clamp(15px, 1.55vw, 21px); font-weight: 600; line-height: 1.22; letter-spacing: -0.025em; text-shadow: 0 2px 14px rgba(0, 0, 0, 0.65); }
    .bio-tags { display: flex; flex-wrap: wrap; gap: 7px; }
    .tag-pill-dark {
      padding: 6px 12px; border-radius: 999px; border: 1px solid rgba(255, 255, 255, 0.26);
      background: rgba(18, 3, 3, 0.5); backdrop-filter: blur(8px);
      font-size: 10px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase;
    }

    /* CATEGORIES */
    .category-screen { display: grid; grid-template-rows: auto minmax(0, 1fr); gap: clamp(10px, 1.5vh, 18px); }
    .category-header { display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; border-bottom: 1px solid var(--light-border); padding-bottom: clamp(8px, 1.2vh, 14px); }
    .category-title-wrap { display: flex; align-items: center; gap: 14px; }
    .category-title { font-size: clamp(22px, 2.6vw, 38px); font-weight: 700; line-height: 0.95; letter-spacing: -0.04em; text-transform: uppercase; }
    .category-title .taupe { color: var(--text-taupe); font-weight: 500; }
    .category-subtitle { font-size: 12px; color: var(--text-body-light); max-width: 44ch; text-align: right; line-height: 1.35; }

    .projects-grid { min-height: 0; height: 100%; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); grid-template-rows: repeat(2, minmax(0, 1fr)); gap: clamp(10px, 1.4vh, 18px); }
    .project-card {
      min-height: 0; background: #fff; border: 1px solid var(--light-border);
      border-radius: var(--radius-card); padding: clamp(10px, 1.4vh, 16px);
      display: grid; grid-template-rows: auto minmax(0, 1fr); gap: clamp(8px, 1vh, 12px);
      box-shadow: 0 8px 24px rgba(61, 7, 7, 0.05); transition: box-shadow 0.25s ease;
    }
    .project-card.featured {
      background: linear-gradient(145deg, #1d0505 0%, #3a0909 70%, #5c100d 100%);
      color: #fff; border-color: rgba(255, 255, 255, 0.12); box-shadow: 0 14px 34px rgba(40, 5, 5, 0.26);
    }
    .project-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; min-width: 0; }
    .project-meta { min-width: 0; flex: 1; }
    .project-title { font-size: clamp(13px, 1.25vw, 17px); font-weight: 700; letter-spacing: -0.025em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .project-desc { font-size: 11px; opacity: 0.72; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .project-head-right { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
    .project-tag { font-size: 9.5px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; padding: 4px 10px; border-radius: 999px; border: 1px solid currentColor; opacity: 0.75; }

    .thumbs-bento { min-height: 0; height: 100%; display: grid; grid-template-columns: 1.45fr 1fr 1fr; grid-template-rows: repeat(2, minmax(0, 1fr)); gap: clamp(6px, 0.8vh, 9px); }
    .thumbs-bento.single-thumb {
      grid-template-columns: 1fr;
      grid-template-rows: minmax(0, 1fr);
    }
    .thumbs-bento.single-thumb .thumb-btn:first-child {
      grid-row: auto;
    }

    .thumb-btn {
      position: relative; width: 100%; height: 100%; min-height: 0;
      border: none; padding: 0; border-radius: var(--radius-thumb); overflow: hidden;
      cursor: pointer; background: #240707; display: block;
    }
    .thumb-btn:first-child { grid-row: span 2; }
    .thumb-btn img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform 0.35s cubic-bezier(0.22, 1, 0.36, 1); }
    .thumb-overlay {
      position: absolute; inset: 0;
      background: linear-gradient(180deg, transparent 40%, rgba(18, 3, 3, 0.82) 100%);
      opacity: 0; transition: opacity 0.22s ease;
      display: flex; align-items: flex-end; justify-content: space-between;
      padding: 8px 12px; color: #fff; font-size: 10px; font-weight: 600;
    }
    .thumb-btn:hover img { transform: scale(1.04); }
    .thumb-btn:hover .thumb-overlay { opacity: 1; }
    .thumb-btn.drag-over { outline: 3px dashed var(--accent-fire); outline-offset: -3px; }
    .thumb-btn.drag-over .thumb-overlay { opacity: 1; background: rgba(230, 36, 21, 0.65); }

    /* CLIENTS & CONTACT */
    .clients-contact-grid { flex: 1; min-height: 0; display: grid; grid-template-columns: 1.25fr 0.95fr; gap: clamp(18px, 2.8vw, 36px); }
    .clients-box { display: flex; flex-direction: column; justify-content: space-between; min-height: 0; gap: 12px; }
    .clients-list { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin: auto 0; }
    .client-chip {
      position: relative; background: #fff; border: 1px solid var(--light-border); border-radius: 14px;
      padding: clamp(10px, 1.5vh, 16px) 14px; display: flex; flex-direction: column; gap: 4px;
      transition: border-color 0.2s ease, transform 0.2s ease;
    }
    .client-chip:hover { border-color: var(--accent-red); }
    .client-chip strong { font-size: 14px; letter-spacing: -0.02em; color: var(--text-burgundy); }
    .client-chip span { font-size: 10.5px; color: var(--text-taupe); text-transform: uppercase; letter-spacing: 0.06em; font-weight: 600; }

    .contact-panel {
      background: linear-gradient(155deg, #250505 0%, #120303 60%, #6d1009 100%);
      color: #fff; border-radius: 20px; padding: clamp(20px, 3vh, 34px);
      display: flex; flex-direction: column; justify-content: space-between;
      box-shadow: 0 22px 46px rgba(61, 7, 7, 0.25);
    }
    .contact-links { display: flex; flex-direction: column; gap: 10px; }
    .contact-row {
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      padding: 12px 16px; border-radius: 14px;
      background: rgba(255, 255, 255, 0.08); border: 1px solid rgba(255, 255, 255, 0.16);
      color: #fff; text-decoration: none; cursor: pointer; font-family: var(--font-sans);
      transition: background 0.2s ease, border-color 0.2s ease; text-align: left;
    }
    .contact-row:hover { background: rgba(230, 36, 21, 0.22); border-color: var(--accent-fire); }
    .contact-row small { display: block; font-size: 10px; text-transform: uppercase; letter-spacing: 0.08em; opacity: 0.65; }
    .contact-row strong { font-size: 14px; font-weight: 600; }

        webCat.projects.forEach(p => {

    // IndexedDB for local auto-save (separate store for English version)
    const DB_NAME = "sergio_portfolio_editor_en_v1";
    const STORE_NAME = "drafts";

    function openDB() {
      return new Promise((resolve, reject) => {
        if (!window.indexedDB) return reject("no-idb");
        const req = indexedDB.open(DB_NAME, 1);
        req.onupgradeneeded = () => {
          if (!req.result.objectStoreNames.contains(STORE_NAME)) {
            req.result.createObjectStore(STORE_NAME);
          }
        };
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
    }

    async function saveDraft() {
      STATE.updatedAt = Date.now();
      const statusEl = document.getElementById("saveStatusText");
      if (statusEl) statusEl.textContent = "Saving...";
      try {
        const db = await openDB();
        const tx = db.transaction(STORE_NAME, "readwrite");
        tx.objectStore(STORE_NAME).put(STATE, "current");
        tx.oncomplete = () => {
          if (statusEl) statusEl.textContent = "Saved locally ✓";
        };
      } catch (e) {
        if (statusEl) statusEl.textContent = "Edited in session";
      }
    }

    async function loadDraftIfNewer() {
      try {
        const db = await openDB();
        const tx = db.transaction(STORE_NAME, "readonly");
        const req = tx.objectStore(STORE_NAME).get("current");
        req.onsuccess = () => {
          const draft = req.result;
          if (draft && (!SAVED_STATE || (draft.updatedAt || 0) >= (SAVED_STATE.updatedAt || 0))) {
            STATE = normalizeState(draft);
            saveDraft();
            renderAll();
          }
        };
      } catch (e) { /* keep current STATE */ }
    }

    async function resetToDefaults() {
      if (!confirm("Restore all texts and images to the default template? This clears the draft saved in your browser.")) return;
      STATE = clone(DEFAULT_STATE);
      try {
        const db = await openDB();
        const tx = db.transaction(STORE_NAME, "readwrite");
        tx.objectStore(STORE_NAME).delete("current");
      } catch (e) {}
      renderAll();
    }

    function escapeHtml(str) {
      return String(str ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function makePlaceholderSVG(label, sublabel, darkMode) {
      const bg1 = darkMode ? "%23250606" : "%233d0707";
      const bg2 = darkMode ? "%237a120a" : "%231b0404";
      return `data:image/svg+xml;utf8,` +
        `<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 800 520'>` +
        `<defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'>` +
        `<stop offset='0%' stop-color='${bg1}'/><stop offset='100%' stop-color='${bg2}'/>` +
        `</linearGradient></defs>` +
        `<rect width='800' height='520' fill='url(%23g)'/>` +
        `<circle cx='680' cy='90' r='170' fill='%23ff4e1b' opacity='0.22'/>` +
        `<text x='48' y='415' fill='%23f7f4f3' font-family='sans-serif' font-weight='700' font-size='34'>${encodeURIComponent(label)}</text>` +
        `<text x='48' y='455' fill='%23f7f4f3' opacity='0.65' font-family='sans-serif' font-size='20'>${encodeURIComponent(sublabel)}</text>` +
        `</svg>`;
    }

    function getByPath(path) {
      return path.split(".").reduce((acc, key) => acc?.[key], STATE);
    }
    function setByPath(path, val) {
      const keys = path.split(".");
      const last = keys.pop();
      const target = keys.reduce((acc, key) => acc[key], STATE);
      if (target) target[last] = val;
    }

    function compressImageFile(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => {
          const img = new Image();
          img.onload = () => {
            const MAX = 1600;
            let { width, height } = img;
            if (width > MAX || height > MAX) {
              if (width > height) { height = Math.round(height * (MAX / width)); width = MAX; }
              else { width = Math.round(width * (MAX / height)); height = MAX; }
            }
            const canvas = document.createElement("canvas");
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext("2d");
            ctx.drawImage(img, 0, 0, width, height);
            resolve(canvas.toDataURL("image/jpeg", 0.85));
          };
          img.onerror = reject;
          img.src = reader.result;
        };
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

      if (!file) return;
      const dataUrl = await compressImageFile(file);
      document.getElementById("imgModalSrc").value = "(Embedded image from computer)";
      document.getElementById("imgModalSrc").dataset.rawSrc = dataUrl;
      document.getElementById("imgModalPreview").src = dataUrl;
    });

    document.getElementById("imgModalSrc").addEventListener("input", (e) => {
      e.target.dataset.rawSrc = e.target.value;
      document.getElementById("imgModalPreview").src = e.target.value;
    });

    function saveImgModal() {
      const rawSrc = document.getElementById("imgModalSrc").dataset.rawSrc || document.getElementById("imgModalSrc").value.trim();
      if (imgModalTarget.type === "cover") {
        STATE.hero.bgSrc = rawSrc;
        renderHero();
      } else if (imgModalTarget.type === "bio") {
        STATE.bio.photoSrc = rawSrc;
        renderBio();
      } else {
        const { catIdx, projIdx, imgIdx } = imgModalTarget;
        const imgObj = STATE.categories[catIdx].projects[projIdx].images[imgIdx];
        imgObj.src = rawSrc;
        imgObj.caption = document.getElementById("imgModalCaption").value.trim();
        renderCategories();
      }
      bindEditableFields();
      saveDraft();
      closeImgModal();
    }

    function previewFromImgModal() {
      if (imgModalTarget?.type === "project") {
        const { catIdx, projIdx, imgIdx } = imgModalTarget;
        closeImgModal();
        openLightbox(catIdx, projIdx, imgIdx);
      }
    }

    function closeImgModal() {
      document.getElementById("imageEditorModal").classList.remove("open");
    }

    // Contact Modal
    function openContactModal() {
      const cs = STATE.clientsSection;
      document.getElementById("cntEmail").value = cs.email;
      document.getElementById("cntWaText").value = cs.whatsappText;
      document.getElementById("cntWaUrl").value = cs.whatsappUrl;
      document.getElementById("cntSocText").value = cs.socialText;
      document.getElementById("cntSocUrl").value = cs.socialUrl;
      document.getElementById("contactEditorModal").classList.add("open");
    }
    function closeContactModal() {
      document.getElementById("contactEditorModal").classList.remove("open");
    }
    function saveContactModal() {
      const cs = STATE.clientsSection;
      cs.email = document.getElementById("cntEmail").value.trim();
      cs.whatsappText = document.getElementById("cntWaText").value.trim();
      cs.whatsappUrl = document.getElementById("cntWaUrl").value.trim();
      cs.socialText = document.getElementById("cntSocText").value.trim();
      cs.socialUrl = document.getElementById("cntSocUrl").value.trim();
      saveDraft();
      renderClients();
      bindEditableFields();
      closeContactModal();
    }

    // Final HTML Export
    function openExportModal() {
      document.getElementById("exportModal").classList.add("open");
    }
    function closeExportModal() {
      document.getElementById("exportModal").classList.remove("open");
    }
    function performExport() {
      const hideBtn = document.getElementById("hideEditOnExport").checked;
      const exportObj = clone(STATE);
      exportObj.hideEditBtn = hideBtn;
      exportObj.updatedAt = Date.now();

      const M_START = "/*__STATE_" + "START__*/";
      const M_END = "/*__STATE_" + "END__*/";
      const i1 = PRISTINE_HTML.indexOf(M_START);
      const i2 = PRISTINE_HTML.indexOf(M_END);

      if (i1 === -1 || i2 === -1) {
        alert("Could not locate the export marker.");
        return;
      }

      const safeJson = JSON.stringify(exportObj).replace(/<\//g, "<\\/");
      const finalHtml =
        PRISTINE_HTML.slice(0, i1) +
        M_START + "const SAVED_STATE = " + safeJson + ";" + M_END +
        PRISTINE_HTML.slice(i2 + M_END.length);

      const blob = new Blob([finalHtml], { type: "text/html;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "index.html";
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
      closeExportModal();
    }

    // Screen Navigation
    const screens = () => Array.from(document.querySelectorAll(".screen"));
    const stageFrame = document.getElementById("stageFrame");
    const slideCounter = document.getElementById("slideCounter");

    function goToScreen(index) {
      const list = screens();
      if (index < 0 || index >= list.length) return;
      currentScreen = index;
      list.forEach((el, i) => el.classList.toggle("active", i === index));
      document.querySelectorAll(".nav-pill").forEach((btn, i) => btn.classList.toggle("active", i === index));
      stageFrame.classList.toggle("is-light", list[index].dataset.theme === "light");
      slideCounter.textContent = `0${index + 1} / 0${list.length}`;
    }

    function nextScreen() { goToScreen((currentScreen + 1) % screens().length); }
    function prevScreen() { goToScreen((currentScreen - 1 + screens().length) % screens().length); }
    function toggleFullscreen() {
      if (!document.fullscreenElement) document.documentElement.requestFullscreen?.();
      else document.exitFullscreen?.();
    }

    // Lightbox
    let lbState = { catIdx: 0, projIdx: 0, imgIdx: 0, open: false };
    const lightbox = document.getElementById("lightbox");
    const lbImage = document.getElementById("lbImage");
    const lbTitle = document.getElementById("lbTitle");
    const lbSubtitle = document.getElementById("lbSubtitle");
    const lbStrip = document.getElementById("lbStrip");

    function openLightbox(catIdx, projIdx, imgIdx) {
      lbState = { catIdx, projIdx, imgIdx, open: true };
      updateLightbox();
      lightbox.classList.add("open");
    }
    function closeLightbox() { lbState.open = false; lightbox.classList.remove("open"); }
    function stepLightbox(dir) {
      const proj = STATE.categories[lbState.catIdx].projects[lbState.projIdx];
      if (proj.images.length <= 1) return;
      lbState.imgIdx = (lbState.imgIdx + dir + proj.images.length) % proj.images.length;
      updateLightbox();
    }
    function updateLightbox() {
      const cat = STATE.categories[lbState.catIdx];
      const proj = cat.projects[lbState.projIdx];
      const isSingle = proj.images.length <= 1;
      const imgObj = proj.images[lbState.imgIdx];
      const fallback = makePlaceholderSVG(proj.title, imgObj.caption, true);

      lightbox.classList.toggle("single-image", isSingle);
      lbTitle.textContent = proj.title;
      lbSubtitle.textContent = isSingle
        ? `${cat.titleMain} ${cat.titleMuted} • ${imgObj.caption}`
        : `${cat.titleMain} ${cat.titleMuted} • ${imgObj.caption} (${lbState.imgIdx + 1}/${proj.images.length})`;

      lbImage.onerror = () => { lbImage.onerror = null; lbImage.src = fallback; };
      lbImage.src = imgObj.src;
      lbImage.alt = imgObj.caption;

      lbStrip.innerHTML = isSingle ? "" : proj.images.map((item, idx) => {
        const thumbFallback = makePlaceholderSVG(`0${idx + 1}`, item.caption, true);
        return `
          <button class="lb-thumb ${idx === lbState.imgIdx ? 'active' : ''}" onclick="openLightbox(${lbState.catIdx}, ${lbState.projIdx}, ${idx})">
            <img src="${escapeHtml(item.src)}" alt="${escapeHtml(item.caption)}" onerror="this.onerror=null; this.src='${thumbFallback}';">
          </button>
        `;
      }).join("");
    }

    function copyEmail(email, btn) {
      navigator.clipboard?.writeText(email);
      const icon = btn.querySelector("span");
      const old = icon.textContent;
      icon.textContent = "Copied ✓";
      setTimeout(() => { icon.textContent = old; }, 1800);
    }

    document.addEventListener("keydown", (e) => {
      if ((e.ctrlKey || e.metaKey) && e.shiftKey && e.key.toLowerCase() === "e") {
        e.preventDefault();
        toggleEditMode();
        return;
      }
      if (e.target.isContentEditable || ["INPUT", "TEXTAREA"].includes(e.target.tagName)) return;

      if (lbState.open) {
        if (e.key === "Escape") closeLightbox();
        if (e.key === "ArrowRight") stepLightbox(1);
        if (e.key === "ArrowLeft") stepLightbox(-1);
        return;
      }
      if (e.key === "ArrowRight") nextScreen();
      if (e.key === "ArrowLeft") prevScreen();
    });

    // Init
    renderAll();
    goToScreen(0);
    loadDraftIfNewer();
  </script>
</body>
</html>
